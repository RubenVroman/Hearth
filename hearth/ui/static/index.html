<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Hearth — VAULT</title>
    <meta name="theme-color" content="#070604" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Hearth" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hearth" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="app">
    <div class="grain" aria-hidden="true"></div>
    <div class="ember" aria-hidden="true"></div>

    <header class="top">
      <div class="brand">
        <span class="mark">Hearth</span>
        <span class="house" id="house">VAULT</span>
      </div>
      <div class="pills">
        <span class="pill" id="agent-pill">idle</span>
        <span class="pill" id="voice-pill">voice off</span>
        <span class="pill dim" id="mode-pill">fallback</span>
        <button type="button" id="settings-btn" class="pill-btn" aria-haspopup="dialog" aria-controls="settings-sheet">
          Look
        </button>
        <button type="button" id="logout-btn" class="pill-btn">Log out</button>
      </div>
    </header>

    <main class="stage">
      <aside class="rail rail-media is-empty" id="rail-media">
        <div class="rail-block is-empty" id="now-playing-block">
          <p class="kicker">Now playing</p>
          <article class="card film" id="now-playing">
            <p class="muted">Nothing on the wire.</p>
          </article>
        </div>
        <div class="rail-block is-empty" id="media-block">
          <p class="kicker rest">AVR · TV</p>
          <div id="media-stack" class="stack"></div>
        </div>
      </aside>

      <section class="hearth">
        <audio id="remote-audio" autoplay playsinline></audio>
        <button type="button" id="orb" class="orb" aria-label="Tap to talk">
          <span class="orb-ring"></span>
          <span class="orb-core"></span>
          <span class="orb-label" id="orb-label">Tap to talk</span>
        </button>
        <p class="hint" id="hint">Tap to talk.</p>
        <div class="composer-dock">
          <form id="composer" class="composer" autocomplete="off">
            <input
              id="line"
              type="text"
              name="line"
              placeholder="Ask the house…"
              maxlength="2000"
              enterkeyhint="send"
              autocapitalize="sentences"
              autocomplete="off"
            />
            <button type="submit">Send</button>
          </form>
          <button type="button" id="confirm-btn" class="confirm hidden">Confirm last action</button>
        </div>
      </section>

      <aside class="rail rail-rooms is-empty" id="rail-rooms">
        <div class="rail-block is-empty" id="lights-block">
          <p class="kicker">Lights</p>
          <div id="lights" class="tiles"></div>
        </div>
        <div class="rail-block is-empty" id="scenes-block">
          <p class="kicker rest">Scenes</p>
          <div id="scenes" class="stack"></div>
        </div>
      </aside>

      <section class="transcript is-empty" id="transcript" aria-live="polite">
        <p class="kicker">Conversation</p>
        <ol id="log"></ol>
      </section>
    </main>

    <div
      id="settings-sheet"
      class="settings-sheet hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
      aria-hidden="true"
    >
      <button type="button" id="settings-backdrop" class="settings-backdrop" aria-label="Close settings"></button>
      <div class="settings-panel" id="settings-panel">
        <header class="settings-head">
          <div>
            <p class="kicker">Hearth</p>
            <h2 id="settings-title">Look &amp; feel</h2>
          </div>
          <button type="button" id="settings-close" class="pill-btn settings-close">Done</button>
        </header>
        <div id="settings-body" class="settings-body"></div>
        <footer class="settings-foot">
          <button type="button" id="settings-reset" class="settings-reset">Reset to Hearth defaults</button>
        </footer>
      </div>
    </div>

    <script src="/static/pwa.js"></script>
    <script src="/static/vad.js"></script>
    <script src="/static/settings.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
