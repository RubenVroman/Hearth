# Tests on every pull request and push. A green push to main (or a manual
# run from main) deploys to VAULT over Tailscale SSH. If the deploy secrets
# are not set yet, that job skips and CI still passes. See docs/ci-cd.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check deploy scripts preserve host files
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi
          bash scripts/test-vault-deploy.sh

  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether deploy secrets are configured
        id: gate
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          VAULT_SSH_PRIVATE_KEY: ${{ secrets.VAULT_SSH_PRIVATE_KEY }}
          VAULT_SSH_USER: ${{ secrets.VAULT_SSH_USER }}
        run: bash scripts/ci-deploy-gate.sh >> "$GITHUB_OUTPUT"

      - name: Tailscale
        if: steps.gate.outputs.ready == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: hearth-ci-${{ github.run_id }}
          version: "1.94.2"
          ping: ${{ secrets.VAULT_SSH_HOST != '' && secrets.VAULT_SSH_HOST || 'vault.taileff393.ts.net' }}

      - name: Deploy to VAULT
        if: steps.gate.outputs.ready == 'true'
        env:
          VAULT_SSH_PRIVATE_KEY: ${{ secrets.VAULT_SSH_PRIVATE_KEY }}
          VAULT_SSH_USER: ${{ secrets.VAULT_SSH_USER }}
          VAULT_SSH_KNOWN_HOSTS: ${{ secrets.VAULT_SSH_KNOWN_HOSTS }}
          VAULT_SSH_HOST: ${{ secrets.VAULT_SSH_HOST }}
          VAULT_SSH_PORT: ${{ secrets.VAULT_SSH_PORT }}
          VAULT_DEPLOY_PATH: ${{ secrets.VAULT_DEPLOY_PATH }}
          VAULT_HEALTHCHECK_URL: ${{ secrets.VAULT_HEALTHCHECK_URL }}
          HEARTH_DEPLOY_SHA: ${{ github.sha }}
        run: bash scripts/vault-deploy.sh
